name: Fork Sync

on:
  schedule:
    - cron: "0 19 */3 * *"     # 每 3 天北京时间 03:00 执行（UTC 19:00）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync_with_upstream:
    name: Sync with Upstream
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.SYNC_PAT != '' && secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main

      - name: Configure Git and remotes
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          git config user.name "GitHub Actions Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout main || git checkout -b main

          if git remote get-url upstream >/dev/null 2>&1; then
            git remote set-url upstream https://github.com/imzyb/MiSub.git
          else
            git remote add upstream https://github.com/imzyb/MiSub.git
          fi

          if [ -n "${SYNC_PAT:-}" ]; then
            git remote set-url origin "https://x-access-token:${SYNC_PAT}@github.com/${{ github.repository }}.git"
            echo "✅ 检测到 SYNC_PAT，将使用 PAT 推送。"
          else
            echo "⚠️ 未配置 SYNC_PAT，将使用默认 GITHUB_TOKEN。"
          fi

          git fetch --prune origin main
          git fetch --prune upstream main

      - name: Mirror upstream main
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          set -euo pipefail

          ORIGIN_SHA="$(git rev-parse origin/main)"
          UPSTREAM_SHA="$(git rev-parse upstream/main)"

          # 备份本 fork 自定义的工作流配置（保留自定义的定时频率）
          cp -r .github/workflows /tmp/workflows_custom

          echo "🚀 正在拉取上游 main 最新提交..."
          git reset --hard upstream/main

          # 检查上游是否包含 workflow 变更
          WORKFLOW_DIFF="$(git diff "${ORIGIN_SHA}" upstream/main -- .github/workflows || true)"

          if [ -n "${WORKFLOW_DIFF}" ]; then
            if [ -n "${SYNC_PAT:-}" ]; then
              echo "ℹ️ 检测到上游工作流更新，已配置 SYNC_PAT，将同步上游工作流。"
            else
              echo "::notice title=Workflow update detected::上游更新了工作流文件。当前使用默认 GITHUB_TOKEN，将保留本 fork 现有工作流并同步其余所有应用代码。"
              rm -rf .github/workflows
              cp -r /tmp/workflows_custom .github/workflows
            fi
          else
            # 上游工作流无变动，恢复本 fork 的自定义工作流配置
            rm -rf .github/workflows
            cp -r /tmp/workflows_custom .github/workflows
          fi

          # 如果工作流有修改，进行提交
          if [ -n "$(git status --porcelain)" ]; then
            git add .github/workflows
            git commit -m "chore(sync): sync upstream and retain custom workflows" || true
          fi

          NEW_LOCAL_SHA="$(git rev-parse HEAD)"
          if [ "${ORIGIN_SHA}" = "${NEW_LOCAL_SHA}" ]; then
            echo "✨ Fork 已与上游完全一致，无需推送。"
            exit 0
          fi

          git push --force-with-lease origin main
          echo "✅ Fork main 已成功同步上游最新代码！"
